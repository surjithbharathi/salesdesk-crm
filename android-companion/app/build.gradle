plugins { id 'com.android.application' }
def crmOrigin = providers.gradleProperty('crmApiOrigin').orElse('http://127.0.0.1:3101').get()
def crmUri = new URI(crmOrigin)
if (!crmUri.host || crmUri.rawUserInfo || crmUri.rawQuery || crmUri.rawFragment || (crmUri.path && crmUri.path != '') || !(crmUri.scheme == 'https' || (crmUri.scheme == 'http' && crmUri.host in ['127.0.0.1','localhost']))) throw new GradleException('Invalid configured CRM service origin')
android {
    namespace 'ai.salesdesk.companion'
    compileSdk 36
    buildFeatures { buildConfig true; resValues true }
    defaultConfig { applicationId 'ai.salesdesk.companion'; minSdk 26; targetSdk 36; versionCode 57; versionName '0.24.4'; resValue 'string', 'app_name', 'Salesdesk'; buildConfigField 'String', 'CRM_API_ORIGIN', groovy.json.JsonOutput.toJson(crmOrigin) }
    if (providers.gradleProperty('crmPreview').orNull == 'true') { defaultConfig { applicationIdSuffix '.preview'; versionNameSuffix '-preview'; resValue 'string', 'app_name', 'Salesdesk Preview' } }
    // Play Store: the upload key is read from a properties file kept outside the repository (-PuploadKeyProps=<path>)
    def uploadProps = providers.gradleProperty("uploadKeyProps").orNull
    if (uploadProps) {
        def p = new Properties(); new File(uploadProps).withInputStream { p.load(it) }
        signingConfigs { upload { storeFile file(p.storeFile); storePassword p.storePassword; keyAlias p.keyAlias; keyPassword p.keyPassword } }
        buildTypes { release { signingConfig signingConfigs.upload } }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
