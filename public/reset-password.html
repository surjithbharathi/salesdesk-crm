<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="referrer" content="no-referrer" />
    <title>Set your Salesdesk password</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <dialog id="reset" class="auth-dialog auth-gate">
      <h1>Salesdesk CRM</h1>
      <h2>Set a new password</h2>
      <p>
        This private recovery link expires in 10 minutes and works once. Enter your new password
        here, not in chat.
      </p>
      <form>
        <label
          >New password<input
            name="password"
            type="password"
            autocomplete="new-password"
            required
            minlength="12"
            maxlength="200" /></label
        ><label
          >Confirm new password<input
            name="confirmation"
            type="password"
            autocomplete="new-password"
            required
            minlength="12"
            maxlength="200"
        /></label>
        <p role="status" class="auth-error"></p>
        <button type="submit" class="primary">Reset password</button>
      </form>
      <p>
        Resetting signs out existing desktop and mobile sessions. Business records and recordings
        are preserved.
      </p>
      <a href="/" hidden id="signin">Continue to sign in</a>
    </dialog>
    <script type="module" src="/reset-password.js"></script>
  </body>
</html>
