name: Verify published Automation runtime
on:
  push:
    branches: [main]
    paths: ['.github/workflows/verify-automation.yml']
  workflow_dispatch:
    inputs:
      image:
        description: 'Published image tag to verify'
        default: 'automation'
        required: true
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      IMAGE_TAG: ${{ inputs.image || 'automation-sha-1ebcb98817e50163c441f8927504ca165edd5b4e' }}
    steps:
      - uses: actions/checkout@v4
      - name: Pull published source-built image
        run: docker pull ghcr.io/surjithbharathi/salesdesk-crm:$IMAGE_TAG
      - name: Start isolated CRM and engine
        run: |
          docker run -d --name automation-smoke --memory=2g --cpus=2 -e PORT=3195 -e MOBILE_PORT=3196 ghcr.io/surjithbharathi/salesdesk-crm:$IMAGE_TAG
          for attempt in $(seq 1 100); do
            if docker logs automation-smoke 2>&1 | grep -q 'Automation runtime ready'; then exit 0; fi
            sleep 2
          done
          docker logs automation-smoke
          exit 1
      - name: Save, edit, run, isolate and revoke
        run: |
          docker cp scripts/automation-smoke.mjs automation-smoke:/app/scripts/automation-smoke.mjs
          docker exec -e AUTOMATION_TEST_ORIGIN=http://localhost:3195 automation-smoke node22 /app/scripts/automation-smoke.mjs
      - name: Runtime diagnostics
        if: failure()
        run: docker logs --tail 80 automation-smoke
      - name: Remove isolated smoke container
        if: always()
        run: docker rm -f automation-smoke
