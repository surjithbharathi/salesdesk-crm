name: Build Salesdesk deployment image
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: salesdesk-container-main
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Build source-only container
        run: docker build --label org.opencontainers.image.revision="$GITHUB_SHA" -t ghcr.io/surjithbharathi/salesdesk-crm:latest -t ghcr.io/surjithbharathi/salesdesk-crm:sha-$GITHUB_SHA .
      - name: Publish image to GitHub Container Registry
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push ghcr.io/surjithbharathi/salesdesk-crm:sha-$GITHUB_SHA
          docker push ghcr.io/surjithbharathi/salesdesk-crm:latest
