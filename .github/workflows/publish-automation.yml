name: Build source-based Automation image
on:
  push:
    branches: [main]
    paths:
      - 'automation/**'
      - 'scripts/start-with-automation.mjs'
      - 'automation-bridge.mjs'
      - '.github/workflows/publish-automation.yml'
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: salesdesk-automation-image
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Build CRM with modified n8n source
        run: docker build -f automation/Dockerfile --label org.opencontainers.image.revision="$GITHUB_SHA" -t ghcr.io/surjithbharathi/salesdesk-crm:automation -t ghcr.io/surjithbharathi/salesdesk-crm:automation-sha-$GITHUB_SHA .
      - name: Publish Automation image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push ghcr.io/surjithbharathi/salesdesk-crm:automation-sha-$GITHUB_SHA
          docker push ghcr.io/surjithbharathi/salesdesk-crm:automation
