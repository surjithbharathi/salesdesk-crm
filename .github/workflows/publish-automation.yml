name: Build source-based Automation image
on:
  push:
    branches: [main]
    paths:
      - 'automation/**'
      - 'scripts/start-with-automation.mjs'
      - 'automation-bridge.mjs'
      - '.github/workflows/publish-automation.yml'
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: salesdesk-automation-image
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
      - run: npm ci
      - run: npm run check
      - run: npm test
      - name: Build CRM with modified n8n source
        run: docker build -f automation/Dockerfile --label org.opencontainers.image.revision="$GITHUB_SHA" -t ghcr.io/surjithbharathi/salesdesk-crm:automation -t ghcr.io/surjithbharathi/salesdesk-crm:automation-sha-$GITHUB_SHA .
      - name: Verify the built runtime with isolated data
        run: |
          docker run -d --name automation-smoke --memory=2g --cpus=2 -e PORT=3195 -e MOBILE_PORT=3196 ghcr.io/surjithbharathi/salesdesk-crm:automation
          ready=false
          for attempt in $(seq 1 100); do
            if docker logs automation-smoke 2>&1 | grep -q 'Automation runtime ready'; then ready=true; break; fi
            sleep 2
          done
          if [ "$ready" != true ]; then docker logs --tail 80 automation-smoke; exit 1; fi
          docker cp scripts/automation-smoke.mjs automation-smoke:/app/scripts/automation-smoke.mjs
          docker exec -e AUTOMATION_TEST_ORIGIN=http://localhost:3195 automation-smoke node22 /app/scripts/automation-smoke.mjs
      - name: Publish Automation image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push ghcr.io/surjithbharathi/salesdesk-crm:automation-sha-$GITHUB_SHA
          docker push ghcr.io/surjithbharathi/salesdesk-crm:automation
      - name: Runtime diagnostics
        if: failure()
        run: docker logs --tail 80 automation-smoke || true
      - name: Remove isolated smoke container
        if: always()
        run: docker rm -f automation-smoke || true
